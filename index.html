<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3edff" />
    <meta name="description" content="TRIPMATE — dostlarla səyahətdə ortaq xərcləri yazın, hər kəsin payını avtomatik hesablayın və kimin kimə nə qədər ödəməli olduğunu bir baxışda görün." />
    <meta property="og:title" content="TRIPMATE — səfər xərcləri, hesabı Tripmate-dən" />
    <meta property="og:description" content="Sən səyahətindən zövq al, xərclərin hesabını Tripmate həll etsin." />
    <title>TRIPMATE — səfər xərclərini dostlarla asan bölüşün</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (no flash).
      try {
        var t = localStorage.getItem("tripmate:theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>TRIPMATE-in işləməsi üçün brauzerdə JavaScript aktiv olmalıdır.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
